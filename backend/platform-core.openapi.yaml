openapi: 3.0.3
info:
  title: Artictern Core and Authentication APIs
  version: 1.0.0
paths:
  /docs:
    get:
      tags: [Documentation]
      summary: Open interactive Swagger UI
      operationId: getApiDocumentation
      responses:
        "200":
          description: Interactive Swagger UI
          content:
            text/html:
              schema:
                type: string
  /docs/openapi.yaml:
    get:
      tags: [Documentation]
      summary: Download the complete OpenAPI contract
      operationId: getOpenApiContract
      responses:
        "200":
          description: Standalone OpenAPI YAML contract
          content:
            application/yaml:
              schema:
                type: string
  /health:
    get:
      tags: [Health]
      summary: Check API health
      operationId: getHealth
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /auth/send-otp:
    post:
      tags: [Authentication]
      summary: Send a login OTP
      operationId: sendOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendOtpRequest"
      responses:
        "200":
          description: OTP sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /auth/verify-otp:
    post:
      tags: [Authentication]
      summary: Verify a login OTP
      operationId: verifyOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOtpRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /auth/me:
    get:
      tags: [Authentication]
      summary: Get the authenticated viewer
      operationId: getAuthenticatedViewer
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh authentication tokens
      operationId: refreshTokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Log out the current session
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout-all:
    post:
      tags: [Authentication]
      summary: Log out all sessions
      operationId: logoutAll
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out from all devices successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/sessions:
    get:
      tags: [Authentication]
      summary: List authenticated user sessions
      operationId: getSessions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sessions fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/sessions/{sessionId}:
    delete:
      tags: [Authentication]
      summary: Revoke a session
      operationId: revokeSession
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Session revoked successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/me:
    get:
      tags: [Profile]
      summary: Get my profile
      operationId: getMyProfile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/me/posts:
    get:
      tags: [Posts]
      summary: Get my posts
      operationId: getMyPosts
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Posts fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/{username}/posts:
    get:
      tags: [Posts]
      summary: Get a user's accessible posts
      description: >
        Returns posts according to their stored visibility. PUBLIC posts are
        visible to everyone. PRIVATE posts are visible to the owner and accepted
        connections. Later profile-privacy changes do not rewrite existing post
        visibility. Blocked viewers receive no posts.
      operationId: getUserPosts
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 50
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: User posts fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Profile not found or unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 1024
        pattern: ^[A-Za-z0-9_-]+$
  responses:
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Access token is missing, invalid, or expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    SendOtpRequest:
      type: object
      required: [provider, identifier]
      properties:
        provider:
          type: string
          enum: [phone, email]
        identifier:
          type: string
    VerifyOtpRequest:
      allOf:
        - $ref: "#/components/schemas/SendOtpRequest"
        - type: object
          required: [otp]
          properties:
            otp:
              type: string
              pattern: ^[0-9]{6}$
    SuccessResponse:
      type: object
      required: [success, message, data, requestId, timestamp]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
        data:
          nullable: true
        requestId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required: [success, code, message, details, requestId, timestamp]
      properties:
        success:
          type: boolean
          enum: [false]
        code:
          type: string
        message:
          type: string
        details:
          nullable: true
        requestId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
