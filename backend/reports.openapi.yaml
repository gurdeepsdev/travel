openapi: 3.0.3

info:
  title: Artictern Reports API
  version: 1.0.0
  description: Profile and post reporting endpoints.

servers:
  - url: http://localhost:3001/api/v1
    description: Local development

tags:
  - name: Reports

paths:
  /users/{userId}/reports:
    post:
      tags:
        - Reports
      summary: Report a user profile
      description: >
        Creates a pending profile report. If the authenticated user
        already has an active report against this profile, the
        existing report is returned without replacing its original
        reason or description.
      operationId: reportUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitReportRequest"
      responses:
        "201":
          description: User report submitted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"
        "400":
          description: >
            Request validation failed or the authenticated user
            attempted to report their own profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/TargetNotAvailable"

  /posts/{postId}/reports:
    post:
      tags:
        - Reports
      summary: Report a post
      description: >
        Creates a pending report against an accessible post. If the
        authenticated user already has an active report against this
        post, the existing report is returned without replacing its
        original reason or description.
      operationId: reportPost
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitReportRequest"
      responses:
        "201":
          description: Post report submitted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"
        "400":
          description: >
            Request validation failed or the authenticated user
            attempted to report their own post.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/TargetNotAvailable"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    PostId:
      name: postId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Access token is missing, invalid, or expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    TargetNotAvailable:
      description: Report target was not found or is not available
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            code: REPORT.TARGET_NOT_AVAILABLE
            message: The report target was not found or is not available.
            details: null
            requestId: 768684c6-458e-468c-9e41-af46fd5404c9
            timestamp: "2026-08-18T07:38:08.573Z"

  schemas:
    ReportReasonCode:
      type: string
      enum:
        - SPAM
        - HARASSMENT
        - HATE_SPEECH
        - NUDITY_OR_SEXUAL_CONTENT
        - VIOLENCE
        - MISINFORMATION
        - IMPERSONATION
        - INTELLECTUAL_PROPERTY
        - OTHER

    SubmitReportRequest:
      type: object
      additionalProperties: false
      required:
        - reasonCode
      properties:
        reasonCode:
          $ref: "#/components/schemas/ReportReasonCode"
        description:
          type: string
          minLength: 1
          maxLength: 500
          example: Repeated promotional or misleading content.

    ReportTarget:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - USER
            - POST
        userId:
          type: string
          format: uuid
          description: Present only when type is USER.
        postId:
          type: string
          format: uuid
          description: Present only when type is POST.

    Report:
      type: object
      additionalProperties: false
      required:
        - id
        - target
        - reasonCode
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        target:
          $ref: "#/components/schemas/ReportTarget"
        reasonCode:
          $ref: "#/components/schemas/ReportReasonCode"
        description:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - PENDING
            - UNDER_REVIEW
            - RESOLVED
            - REJECTED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ReportData:
      type: object
      additionalProperties: false
      required:
        - report
      properties:
        report:
          $ref: "#/components/schemas/Report"

    ReportResponse:
      type: object
      required:
        - success
        - message
        - data
        - requestId
        - timestamp
      properties:
        success:
          type: boolean
          enum:
            - true
        message:
          type: string
        data:
          $ref: "#/components/schemas/ReportData"
        requestId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required:
        - success
        - code
        - message
        - details
        - requestId
        - timestamp
      properties:
        success:
          type: boolean
          enum:
            - false
        code:
          type: string
        message:
          type: string
        details:
          nullable: true
        requestId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
