      properties:
        memories:
          type: array
          items:
            $ref: "#/components/schemas/Memory"
        pagination:
          $ref: "#/components/schemas/Pagination"

    GetMemoriesResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/GetMemoriesData"

    CreatePostMultipartRequest:
      type: object
      additionalProperties: false
      required:
        - placeId
      properties:
        caption:
          type: string
          minLength: 1
          maxLength: 250
        visibility:
          type: string
          enum:
            - PUBLIC
            - PRIVATE
          default: PUBLIC
        placeId:
          type: string
          format: uuid
        files:
          type: array
          maxItems: 10
          description: >
            New image or video files. Images may be at most 25 MiB
            each. Videos may be at most 250 MiB each.
          items:
            type: string
            format: binary
        existingAssetIds:
          type: string
          maxLength: 65536
          description: >
            JSON-encoded array containing at most 10 unique UUIDs of
            active media assets owned by the authenticated user.
          example: >
            ["aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1"]
        mediaOrder:
          type: string
          maxLength: 65536
          description: >
            JSON-encoded array defining final media order. UPLOAD
            entries reference the zero-based position in files.
            EXISTING entries reference an ID included in
            existingAssetIds. Required when uploads and existing
            assets are combined.
          example: >
            [{"source":"UPLOAD","fileIndex":0},{"source":"EXISTING","assetId":"aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1"}]
        itineraryIds:
          type: string
          maxLength: 65536
          description: >
            JSON-encoded array containing at most 5 unique UUIDs of
            eligible itineraries owned by the authenticated user.
          example: >
            ["11111111-1111-4111-8111-111111111111"]
        taggedUserIds:
          type: string
          maxLength: 65536
          description: >
            JSON-encoded array containing at most 20 unique user UUIDs.
            The author cannot tag themselves, unavailable users, or
            users across a block relationship.
          example: "[]"

    CreatePostData:
      type: object
      required:
        - post
      properties:
        post:
          $ref: "./saved-content.openapi.yaml#/components/schemas/FullPost"

    CreatePostResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/CreatePostData"
