    SaveMemoryRequest:
      type: object
      additionalProperties: false
      required:
        - assetId
        - memoryType
      properties:
        assetId:
          type: string
          format: uuid
        memoryType:
          type: string
          enum:
            - IMAGE
            - VIDEO
            - BOOMERANG

    SaveMemoryMultipartRequest:
      type: object
      additionalProperties: false
      required:
        - memoryType
        - memoryFile
      properties:
        memoryType:
          type: string
          enum:
            - IMAGE
            - VIDEO
            - BOOMERANG
        memoryFile:
          type: string
          format: binary
          description: >
            One image or video file. Images may be at most 25 MiB.
            Videos may be at most 250 MiB. BOOMERANG uses video media.

    MemoryAsset:
      type: object
      required:
        - id
        - originalFilename
        - mimeType
        - extension
        - fileSize
        - width
        - height
        - durationSeconds
        - isPublic
        - url
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        originalFilename:
          type: string
          nullable: true
        mimeType:
          type: string
          nullable: true
        extension:
          type: string
          nullable: true
        fileSize:
          type: integer
          nullable: true
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        durationSeconds:
          type: integer
          nullable: true
        isPublic:
          type: boolean
        url:
          type: string
          nullable: true
          description: >
            Public R2 URL for public remote assets, or the local
            access-controlled media endpoint for local assets.
            Private non-local assets may return null.
        createdAt:
          type: string
          format: date-time
          nullable: true

    Memory:
      type: object
      required:
        - id
        - memoryType
        - createdAt
