components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ItineraryId:
      name: itineraryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PostId:
      name: postId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 1024
        pattern: ^[A-Za-z0-9_-]+$
  responses:
    BadRequest:
      description: Validation failed or pagination cursor is invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Access token is missing, invalid, or expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PostNotFound:
      description: The post is missing, already deleted, or not owned by the user
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            code: POST.NOT_FOUND
            message: Post not found.
            details: null
            requestId: 65688c65-9a2c-4efc-a2ea-3bfecdcd2b6f
            timestamp: 2026-08-20T06:57:51.198Z
    PostReferenceNotAllowed:
      description: >
        The place, existing asset, itinerary, or tagged user was not found or is
        not allowed for the authenticated user.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            placeNotAllowed:
              value:
                success: false
                code: POST.PLACE_NOT_ALLOWED
                message: Post place was not found or is not available.
                details: null
                requestId: 65688c65-9a2c-4efc-a2ea-3bfecdcd2b6f
                timestamp: 2026-08-05T07:22:58.846Z
            assetNotAllowed:
              value:
                success: false
                code: POST.ASSET_NOT_ALLOWED
                message: A post asset was not found or is not allowed.
                details: null
                requestId: 65688c65-9a2c-4efc-a2ea-3bfecdcd2b6f
                timestamp: 2026-08-05T07:22:58.846Z
    PostMediaTooLarge:
      description: Uploaded media exceeds its permitted size
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            code: POST.MEDIA_TOO_LARGE
            message: A post media file is too large.
            details:
              field: files
              maximumBytes: 262144000
            requestId: 65688c65-9a2c-4efc-a2ea-3bfecdcd2b6f
            timestamp: 2026-08-05T07:22:58.846Z
    PostMediaInvalidType:
      description: >
        Uploaded media has an unsupported type or its declared MIME type does
        not match its binary file signature.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            code: POST.MEDIA_INVALID_TYPE
            message: Post media type is not supported.
            details:
              field: files
              mimeType: application/pdf
            requestId: 65688c65-9a2c-4efc-a2ea-3bfecdcd2b6f
            timestamp: 2026-08-05T07:22:58.846Z
    PostCreateFailed:
