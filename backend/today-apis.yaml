    MemoryAssetNotAllowed:
      description: >
        Asset was missing, unowned, soft-deleted, or incompatible with the
        requested memory type.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            code: MEMORY.ASSET_NOT_ALLOWED
            message: Memory asset was not found or is not allowed.
            details: null
            requestId: 1e573acd-0633-4c84-b478-634055f390bb
            timestamp: 2026-08-04T11:22:08.691Z
    MemoryMediaTooLarge:
      description: Uploaded memory media exceeds its permitted size
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            code: MEMORY.MEDIA_TOO_LARGE
            message: Memory media is too large.
            details:
              field: memoryFile
              maximumBytes: 262144000
            requestId: 1e573acd-0633-4c84-b478-634055f390bb
            timestamp: 2026-08-17T05:33:36.636Z
    MemoryMediaInvalidType:
      description: >
        Uploaded media is unsupported, has a mismatched signature, or does not
        match memoryType.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            code: MEMORY.MEDIA_INVALID_TYPE
            message: Memory type does not match the uploaded media.
            details:
              memoryType: VIDEO
              detectedMediaType: IMAGE
            requestId: 1e573acd-0633-4c84-b478-634055f390bb
            timestamp: 2026-08-17T05:33:44.704Z
