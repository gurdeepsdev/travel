  "/users/{userId}/block":
    post:
      tags:
        - Blocks
      summary: Block a user
      description: >
        Blocks an active user. Repeated requests are idempotent. Any accepted
        connection between the users is removed and pending connection requests
        in either direction are cancelled.
      operationId: blockUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User blocked successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockUserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: User was not found or is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - Blocks
      summary: Unblock a user
      description: >
        Removes a block created by the authenticated user. Repeated requests
        succeed with unblocked set to false.
      operationId: unblockUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
