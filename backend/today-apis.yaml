  "/users/me/connection-requests/{requestId}":
    patch:
      tags:
        - Connection Requests
      summary: Accept or reject a connection request
      operationId: respondToConnectionRequest
      description: >
        Allows only the stored receiver to accept or reject a pending request.
        Repeating the same action is idempotent. Accepting creates one canonical
        symmetric connection.
      security:
        - bearerAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - action
              properties:
                action:
                  type: string
                  enum:
                    - ACCEPT
                    - REJECT
            examples:
              accept:
                value:
                  action: ACCEPT
              reject:
                value:
                  action: REJECT
      responses:
        "200":
          description: Request accepted, rejected, or already resolved with the same action
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/paths/~1users~1me~1connections/get/responses/200/content/application~1\
                      json/schema/allOf/0"
                  - type: object
                    properties:
                      data:
                        type: object
                        required:
                          - actionApplied
                          - connectionRequest
                          - connection
                        properties:
                          actionApplied:
                            type: boolean
                          connectionRequest:
                            allOf:
                              - type: object
                                required:
                                  - id
                                  - senderUserId
                                  - receiverUserId
                                  - status
                                  - createdAt
                                  - updatedAt
                                  - resolvedAt
                                properties:
                                  id:
                                    type: string
                                    format: uuid
                                  senderUserId:
                                    type: string
                                    format: uuid
                                  receiverUserId:
                                    type: string
                                    format: uuid
                                  status:
                                    type: string
                                    enum:
                                      - PENDING
                                      - ACCEPTED
                                      - REJECTED
                                      - CANCELLED
                                  createdAt:
                                    type: string
                                    format: date-time
                                  updatedAt:
                                    type: string
                                    format: date-time
                                  resolvedAt:
                                    type: string
                                    format: date-time
                                    nullable: true
                              - type: object
                                properties:
                                  sender:
                                    type: object
                                    required:
                                      - id
                                      - username
                                      - displayName
                                      - isVerified
                                      - isPrivate
                                      - profilePhoto
                                    properties:
                                      id:
                                        type: string
                                        format: uuid
                                      username:
                                        type: string
                                      displayName:
                                        type: string
                                        nullable: true
                                      isVerified:
                                        type: boolean
                                      isPrivate:
                                        type: boolean
                                      profilePhoto:
                                        allOf:
                                          - type: object
                                            required:
                                              - id
                                              - storageProvider
                                              - storageKey
                                              - url
                                              - mimeType
                                            properties:
                                              id:
                                                type: string
                                                format: uuid
                                              storageProvider:
                                                type: string
                                              bucket:
                                                type: string
                                                nullable: true
                                              storageKey:
                                                type: string
                                              url:
                                                type: string
                                              mimeType:
                                                type: string
                                        nullable: true
                          connection:
                            allOf:
                              - type: object
                                required:
                                  - id
                                  - userLowId
                                  - userHighId
                                  - connectedAt
                                properties:
                                  id:
                                    type: string
                                    format: uuid
                                  userLowId:
                                    type: string
                                    format: uuid
                                  userHighId:
                                    type: string
                                    format: uuid
                                  connectedAt:
                                    type: string
                                    format: date-time
                            nullable: true
        "400":
          $ref: "#/paths/~1users~1me~1connections~1%7BuserId%7D/delete/responses/400"
        "401":
          $ref: "#/paths/~1users~1me~1connections/get/responses/401"
        "404":
          description: Connection request is missing or unavailable to this user
          content:
            application/json:
              schema:
                $ref: "#/paths/~1users~1me~1connections/get/responses/400/content/application~1\
                  json/schema"
    delete:
      tags:
        - Connection Requests
      summary: Cancel an outgoing connection request
      operationId: cancelConnectionRequest
      description: >
        Allows only the stored sender to cancel a pending request. Repeating
        cancellation is idempotent. Request history is preserved with status
        CANCELLED.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/paths/~1users~1me~1connection-requests~1%7BrequestId%7D/patch/paramete\
