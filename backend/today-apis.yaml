openapi: 3.0.3
info:
  title: Artictern API
  version: 1.2.0
  description: >
    Consolidated contract for all registered Artictern production APIs.
servers:
  - url: https://apitest.artictern.com/api/v1
    description: UAT
  - url: http://localhost:3001/api/v1
    description: Local development
tags:
  - name: Saved Content
  - name: Profile
  - name: Comments
  - name: Comment Likes
  - name: Memories
  - name: Post Creation
  - name: Post Management
  - name: Post Reposts
  - name: Media Delivery
  - name: Visited Places
  - name: Connections
  - name: Connection Requests
  - name: Connection Suggestions
  - name: Blocks
  - name: Explore
  - name: Itineraries
paths:
  /docs:
    $ref: "./platform-core.openapi.yaml#/paths/~1docs"
  /docs/openapi.yaml:
    $ref: "./platform-core.openapi.yaml#/paths/~1docs~1openapi.yaml"
  /health:
    $ref: "./platform-core.openapi.yaml#/paths/~1health"
  /auth/send-otp:
    $ref: "./platform-core.openapi.yaml#/paths/~1auth~1send-otp"
  /auth/verify-otp:
    $ref: "./platform-core.openapi.yaml#/paths/~1auth~1verify-otp"
  /auth/me:
    $ref: "./platform-core.openapi.yaml#/paths/~1auth~1me"
  /auth/refresh:
    $ref: "./platform-core.openapi.yaml#/paths/~1auth~1refresh"
  /auth/logout:
    $ref: "./platform-core.openapi.yaml#/paths/~1auth~1logout"
  /auth/logout-all:
    $ref: "./platform-core.openapi.yaml#/paths/~1auth~1logout-all"
  /auth/sessions:
    $ref: "./platform-core.openapi.yaml#/paths/~1auth~1sessions"
  "/auth/sessions/{sessionId}":
    $ref: "./platform-core.openapi.yaml#/paths/~1auth~1sessions~1{sessionId}"
  /users/me:
    $ref: "./platform-core.openapi.yaml#/paths/~1users~1me"
  /users/me/posts:
    $ref: "./platform-core.openapi.yaml#/paths/~1users~1me~1posts"
  "/users/{username}/posts":
    $ref: "./platform-core.openapi.yaml#/paths/~1users~1{username}~1posts"
  "/posts/{postId}/reactions":
    $ref: "./posts.openapi.yaml#/paths/~1posts~1{postId}~1reactions"
  "/posts/{postId}/reaction":
    $ref: "./posts.openapi.yaml#/paths/~1posts~1{postId}~1reaction"
  "/posts/{postId}/repost":
    $ref: "./posts.openapi.yaml#/paths/~1posts~1{postId}~1repost"
  "/posts/{postId}/been-there":
    $ref: "./posts.openapi.yaml#/paths/~1posts~1{postId}~1been-there"
  "/posts/{postId}/comments":
    $ref: "./posts.openapi.yaml#/paths/~1posts~1{postId}~1comments"
  "/comments/{commentId}/like":
    $ref: "./posts.openapi.yaml#/paths/~1comments~1{commentId}~1like"
  "/posts/{postId}/saved":
    $ref: "./posts.openapi.yaml#/paths/~1posts~1{postId}~1saved"
  "/users/{userId}/reports":
    $ref: "./reports.openapi.yaml#/paths/~1users~1{userId}~1reports"
  "/posts/{postId}/reports":
    $ref: "./reports.openapi.yaml#/paths/~1posts~1{postId}~1reports"
  /itineraries:
    get:
      tags:
        - Itineraries
      summary: List my saved itineraries
      description: >
        Returns active itineraries created by the authenticated user in
        newest-first order.
      operationId: listMyItineraries
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Itineraries fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItineraryListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - Itineraries
      summary: Save a generated itinerary
      operationId: saveItinerary
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveItineraryRequest"
      responses:
        "201":
          description: Itinerary saved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveItineraryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /itineraries/completed:
    get:
      tags:
        - Itineraries
      summary: List my completed itineraries
      description: >
        Returns active itineraries created by the authenticated user whose
        trip status is completed, in newest-first order.
      operationId: listMyCompletedItineraries
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Completed itineraries fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItineraryListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  "/itineraries/{itineraryId}":
    get:
      tags:
        - Itineraries
      summary: Get a saved itinerary
      description: >
        Returns an active itinerary owned by the authenticated user. Missing,
        deleted, and unowned itineraries return the same not-found response.
      operationId: getItinerary
      security:
        - bearerAuth: []
      parameters:
        - name: itineraryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Itinerary fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveItineraryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Itinerary not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                code: ITINERARY.NOT_FOUND
                message: Itinerary not found.
                details: null
                requestId: 65688c65-9a2c-4efc-a2ea-3bfecdcd2b6f
                timestamp: 2026-08-24T10:00:00.000Z
  "/itineraries/{itineraryId}/status":
    patch:
      tags:
        - Itineraries
      summary: Update my itinerary lifecycle status
      description: >
        Moves an owned itinerary through SAVED, UPCOMING, LIVE, and COMPLETED.
        Valid transitions are SAVED to UPCOMING, UPCOMING to LIVE, and LIVE to
        COMPLETED. Repeating the current status is idempotent.
      operationId: updateItineraryStatus
      security:
        - bearerAuth: []
      parameters:
        - name: itineraryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateItineraryStatusRequest"
      responses:
        "200":
          description: Itinerary status updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateItineraryStatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Itinerary not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Invalid itinerary status transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  "/itineraries/{itineraryId}/vault/documents":
    post:
      tags: [Itinerary Vault]
      summary: Upload a private itinerary document
      operationId: uploadItineraryVaultDocument
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ItineraryId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadVaultDocumentRequest"
      responses:
        "201":
          description: Vault document uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultDocumentResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Itinerary has not been moved to a trip
        "413":
          description: Document exceeds 25 MB
        "415":
          description: Unsupported document file type
    get:
      tags: [Itinerary Vault]
      summary: List my itinerary vault documents
      operationId: listItineraryVaultDocuments
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ItineraryId"
        - name: documentType
          in: query
          schema:
            $ref: "#/components/schemas/VaultDocumentType"
      responses:
        "200":
          description: Vault documents fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultDocumentListResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Itinerary has not been moved to a trip
  /explore/countries:
    get:
      tags:
        - Explore
      summary: List popular countries
      description: >
        Returns active countries ranked by available place media and place
        count. Images use country flag, city icon, and place media fallback.
      operationId: getExploreCountries
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
      responses:
        "200":
          description: Explore countries fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExploreCountriesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /explore/feed:
    get:
      tags:
        - Explore
      summary: Get the composite Explore feed
      description: >
        Returns public posts with popular-city and nearby-place discovery
        modules inserted on the first page. Authentication is optional.
        Anonymous viewers receive at most 20 posts without a next cursor.
        Authenticated viewers receive opaque cursor pagination.
      operationId: getExploreFeed
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: latitude
          in: query
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: longitude
          in: query
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
        - name: radiusKm
          in: query
          description: Requires latitude and longitude.
          schema:
            type: number
            format: double
            minimum: 0
            exclusiveMinimum: true
            maximum: 500
            default: 50
        - name: limit
          in: query
          description: Number of posts, excluding discovery modules.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Explore feed fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExploreFeedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /explore/cities:
    get:
      tags:
        - Explore
      summary: List popular cities
      operationId: getExploreCities
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: category
          in: query
          required: false
          description: >
            Optional case-insensitive city category. Empty and For You preserve
            the default popular-city results.
          schema:
            type: string
            enum:
              - For You
              - Peaceful
              - Fun
              - History and Culture
              - Adventure
            default: For You
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
      responses:
        "200":
          description: Explore cities fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExploreCitiesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  "/explore/cities/{cityId}/places":
    get:
      tags:
        - Explore
      summary: List places in a city
      description: Returns open places whose city_id matches the path city ID.
      operationId: getExploreCityPlaces
      parameters:
        - name: cityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: City places fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExploreCityPlacesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  "/explore/cities/{cityId}/saved":
    put:
      tags:
        - Explore
      summary: Save a city
      description: Saves or reactivates an active city for the authenticated user.
      operationId: saveExploreCity
      security:
        - bearerAuth: []
      parameters:
        - name: cityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: City saved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CitySaveResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: City not found or inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - Explore
      summary: Remove a saved city
      description: Soft-removes a saved city. Repeated requests are idempotent.
      operationId: removeSavedExploreCity
      security:
        - bearerAuth: []
      parameters:
        - name: cityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Saved city removed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CitySaveResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: City not found or inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /explore/places:
    get:
      tags:
        - Explore
      summary: List nearby or globally ranked places
      description: >
        When latitude and longitude are supplied, returns open places within
        radiusKm ordered by distance. Without coordinates, returns open places
        using rating, review count, and name ordering.
      operationId: getExplorePlaces
      parameters:
        - name: latitude
          in: query
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: longitude
          in: query
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
        - name: radiusKm
          in: query
          schema:
            type: number
            format: double
            minimum: 0
            exclusiveMinimum: true
            maximum: 500
            default: 50
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
      responses:
        "200":
          description: Explore places fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExplorePlacesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /posts:
    post:
      tags:
        - Post Creation
      summary: Create a place post
      description: >
        Creates a PLACE post for the authenticated user. The request may contain
        newly uploaded media, existing media assets owned by the user, owned
        itineraries, or a combination of these. At least one media asset or
        itinerary is required. When newly uploaded files and existing assets are
        combined, mediaOrder must reference every file and existing asset
        exactly once. The first ordered asset becomes the cover asset.
      operationId: createPost
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreatePostMultipartRequest"
            encoding:
              files:
                contentType: >
                  image/jpeg, image/png, image/webp, image/gif, image/heic,
                  image/heif, video/mp4, video/quicktime, video/webm
      responses:
        "201":
          description: Post created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePostResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/PostReferenceNotAllowed"
        "413":
          $ref: "#/components/responses/PostMediaTooLarge"
        "415":
          $ref: "#/components/responses/PostMediaInvalidType"
        "500":
          $ref: "#/components/responses/PostCreateFailed"
  /posts/{postId}:
    delete:
      tags:
        - Post Management
      summary: Delete my post
      description: >
        Soft-deletes a post owned by the authenticated user. Missing,
        already-deleted, and unowned posts return the same not-found response.
      operationId: deletePost
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Post deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletePostResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/PostNotFound"
        "500":
          description: An unexpected error occurred
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users/me/saved-posts:
    get:
      tags:
        - Saved Content
      summary: Get my saved posts
      operationId: getMySavedPosts
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: cityId
          in: query
          required: false
          description: Return saved posts associated with this city.
          schema:
            type: string
            format: uuid
        - name: countryId
          in: query
          required: false
          description: Return saved posts associated with this country.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Saved posts fetched successfully
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required:
                      - success
                      - message
                      - data
                      - requestId
                      - timestamp
                    properties:
                      success:
                        type: boolean
                        enum:
                          - true
                      message:
                        type: string
                      data:
                        type: object
                      requestId:
                        type: string
                        format: uuid
                        nullable: true
                      timestamp:
                        type: string
                        format: date-time
                  - type: object
                    properties:
                      data:
                        type: object
                        required:
                          - posts
                          - pagination
                        properties:
                          posts:
                            type: array
                            items:
                              $ref: "#/components/schemas/CreatePostData/properties/post"
                          pagination:
                            type: object
                            required:
                              - hasMore
                              - nextCursor
                            properties:
                              hasMore:
                                type: boolean
                              nextCursor:
                                type: string
                                nullable: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/me/saved-posts/groups:
    get:
      tags:
        - Saved Content
      summary: Group my saved posts by city or country
      description: >
        Returns location groups for the authenticated user's accessible saved
        posts. Each group contains up to three hydrated preview posts. Posts
        without a resolvable city or country are excluded from grouped results.
      operationId: getMySavedPostGroups
      security:
        - bearerAuth: []
      parameters:
        - name: groupBy
          in: query
          required: true
          schema:
            type: string
            enum:
              - city
              - country
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Saved-post groups fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedPostGroupsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  "/media/assets/{assetId}/content":
    get:
      tags:
        - Media Delivery
      summary: Get local media content
      description: >
        Delivers the binary content of a local media asset. Authentication is
        optional for public assets. A private local asset is delivered only when
        the authenticated viewer owns it. Missing, unauthorized, and non-local
        assets are returned as not found.
      operationId: getMediaAssetContent
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: Media content
          headers:
            Cache-Control:
              description: >
                Public assets use public caching. Private assets use private,
                no-store.
              schema:
                type: string
            Content-Disposition:
              description: Content is delivered inline
              schema:
                type: string
                example: inline
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/heic:
              schema:
                type: string
                format: binary
            image/heif:
              schema:
                type: string
                format: binary
            video/mp4:
              schema:
                type: string
                format: binary
            video/quicktime:
              schema:
                type: string
                format: binary
            video/webm:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/MediaAssetNotFound"
        "503":
          $ref: "#/components/responses/MediaContentUnavailable"
  "/users/{username}/saved-places":
    get:
      tags:
        - Saved Content
      summary: Get public saved places for a user
      description: >
        Returns canonical POI cards derived from accessible saved posts.
        Authentication is optional. Private or blocked profile relationships
        return an empty place list.
      operationId: getUserSavedPlaces
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 50
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Saved places fetched successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/paths/~1users~1me~1saved-posts/get/responses/200/content/application~1\
                      json/schema/allOf/0"
                  - type: object
                    properties:
                      data:
                        type: object
                        required:
                          - username
                          - places
                          - pagination
                        properties:
                          username:
                            type: string
                          places:
                            type: array
                            items:
                              type: object
                              required:
                                - id
                                - title
                                - description
                                - image
                                - address
                                - latitude
                                - longitude
                                - rating
                                - reviewCount
                                - isVerified
                                - isClosed
                              properties:
                                id:
                                  type: string
                                  format: uuid
                                title:
                                  type: string
                                  nullable: true
                                description:
                                  type: string
                                  nullable: true
                                image:
                                  type: object
                                  nullable: true
                                  required:
                                    - id
                                    - storageProvider
                                    - bucket
                                    - storageKey
                                    - url
                                    - mimeType
                                  properties:
                                    id:
                                      type: string
                                      format: uuid
                                    storageProvider:
                                      type: string
                                      nullable: true
                                    bucket:
                                      type: string
                                      nullable: true
                                    storageKey:
                                      type: string
                                      nullable: true
                                    url:
                                      type: string
                                      nullable: true
                                    mimeType:
                                      type: string
                                      nullable: true
                                address:
                                  type: string
