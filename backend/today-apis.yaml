  /users/me/visited-place-verifications:
    post:
      tags:
        - Visited Places
      summary: Verify a visited place or city
      operationId: submitVisitedPlaceVerification
      description: >
        Verifies a historical gallery photo using EXIF GPS and capture time.
        A city can be verified directly with googleCityPlaceId, or indirectly
        through an internal or Google place identifier. The uploaded photo
        remains private.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              description: >
                Provide placeId, googlePlaceId, or googleCityPlaceId. A city-only
                verification requires only googleCityPlaceId and the photo.
                placeId and googlePlaceId cannot be sent together.
              anyOf:
                - required:
                    - placeId
                - required:
                    - googlePlaceId
                - required:
                    - googleCityPlaceId
              not:
                required:
                  - placeId
                  - googlePlaceId
              required:
                - verificationPhoto
              properties:
                placeId:
                  type: string
                  format: uuid
                  description: Internal Artictern place UUID. Do not send with googlePlaceId.
                googlePlaceId:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: Google Places provider ID. Do not send with placeId.
                  example: ChIJArticternVisitedPlaceTest
                googleCityPlaceId:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: >
                    Google city Place ID. Send it alone for city-only
                    verification, or with a place identifier to confirm the
                    place belongs to that city.
                  example: ChIJdd4hrwug2EcRmSrV3Vo6llI
                claimedVisitedAt:
                  type: string
                  format: date-time
                  description: Optional claimed visit time with timezone
                verificationPhoto:
                  type: string
                  format: binary
                  description: >
                    JPEG, PNG, WebP, HEIC, or HEIF image with a maximum size of
                    15 MB.
      responses:
        "201":
          description: Visited place or city verified successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - visitCreated
                      - verification
                      - visitedPlace
                      - cityCollection
                    properties:
                      visitCreated:
                        type: boolean
                      verification:
                        type: object
                        required:
                          - status
                          - confidence
                          - method
                          - distanceMeters
                          - radiusMeters
                        properties:
                          status:
                            type: string
                            enum:
                              - VERIFIED
                          confidence:
                            type: string
                            nullable: true
                            example: MEDIUM
                          method:
                            type: string
                            nullable: true
                            example: EXIF_GPS_AND_CAPTURE_TIME
                          distanceMeters:
                            type: number
                            format: double
                            nullable: true
                          radiusMeters:
                            type: number
                            format: double
                            nullable: true
                            example: 500
                      visitedPlace:
                        type: object
                        required:
                          - id
                          - visitedAt
                          - claimedVisitedAt
                          - evidenceCapturedAt
                          - visitSource
                          - place
                          - city
                          - evidence
                        properties:
                          id:
                            type: string
                            format: uuid
                          visitedAt:
                            type: string
                            format: date-time
                          claimedVisitedAt:
                            type: string
                            format: date-time
                            nullable: true
                          evidenceCapturedAt:
                            type: string
                            format: date-time
                            nullable: true
                          visitSource:
                            type: string
                            example: PHOTO_VERIFICATION
                          place:
                            type: object
                            required:
                              - id
                              - name
                            properties:
                              id:
                                type: string
                                format: uuid
                              name:
                                type: string
                                nullable: true
                          city:
                            type: object
                            required:
                              - id
                              - name
                              - officialName
                              - country
                            properties:
                              id:
                                type: string
                                format: uuid
                              name:
                                type: string
                                nullable: true
                              officialName:
                                type: string
                                nullable: true
                              country:
                                $ref: "#/paths/~1users~1me~1visited-collections~1%7BcollectionId%7D~1preference\
                                  /patch/responses/200/content/application~1jso\
                                  n/schema/properties/data/properties/collectio\
                                  n/properties/city/properties/country"
                          evidence:
                            type: object
                            required:
                              - assetId
                              - originalFilename
                              - mimeType
                              - extension
                              - fileSize
                              - isPublic
                              - url
                            properties:
                              assetId:
                                type: string
                                format: uuid
                                nullable: true
                              originalFilename:
                                type: string
                                nullable: true
                              mimeType:
                                type: string
                                nullable: true
                              extension:
                                type: string
                                nullable: true
                              fileSize:
                                type: integer
                                nullable: true
                              isPublic:
                                type: boolean
                                example: false
                              url:
                                type: string
                                nullable: true
                                description: Authenticated media-content endpoint
                      cityCollection:
                        type: object
                        required:
                          - id
                          - cityId
                          - name
                          - verificationStatus
                          - visitedAt
                          - isPreference
                          - iconAssetId
                        properties:
                          id:
                            type: string
                            format: uuid
                          cityId:
                            type: string
                            format: uuid
                          name:
                            type: string
                            nullable: true
                          verificationStatus:
                            type: boolean
                          visitedAt:
                            type: string
                            format: date-time
                            nullable: true
                          isPreference:
                            type: boolean
                          iconAssetId:
                            type: string
                            format: uuid
                            nullable: true
                  requestId:
                    type: string
                    format: uuid
                  timestamp:
                    type: string
                    format: date-time
        "400":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/paths/~1users~1me~1visited-places/get/responses/400/content/applicatio\
                  n~1json/schema"
        "401":
          $ref: "#/paths/~1users~1me~1visited-places/get/responses/401"
        "404":
          description: Place is unavailable for verification
          content:
            application/json:
              schema:
                $ref: "#/paths/~1users~1me~1visited-places/get/responses/400/content/applicatio\
                  n~1json/schema"
        "409":
          description: Place is already verified or evidence was already used
          content:
            application/json:
              schema:
                $ref: "#/paths/~1users~1me~1visited-places/get/responses/400/content/applicatio\
                  n~1json/schema"
        "413":
          description: Verification photo exceeds 15 MB
          content:
            application/json:
              schema:
                $ref: "#/paths/~1users~1me~1visited-places/get/responses/400/content/applicatio\
                  n~1json/schema"
        "415":
          description: Verification photo is not a supported image type
          content:
            application/json:
              schema:
                $ref: "#/paths/~1users~1me~1visited-places/get/responses/400/content/applicatio\
                  n~1json/schema"
        "422":
          description: Photo evidence could not verify the visit
          content:
            application/json:
              schema:
                $ref: "#/paths/~1users~1me~1visited-places/get/responses/400/content/applicatio\
                  n~1json/schema"
        "500":
          description: Verification evidence could not be processed or stored
          content:
            application/json:
              schema:
                $ref: "#/paths/~1users~1me~1visited-places/get/responses/400/content/applicatio\
                  n~1json/schema"
