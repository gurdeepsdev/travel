          properties:
            num_days:
              type: integer
              minimum: 1
              maximum: 365
            total_places:
              type: integer
              minimum: 0
        days:
          type: array
          minItems: 1
          maxItems: 365
          items:
            type: object
            required:
              - day
              - items
            additionalProperties: true
            properties:
              day:
                type: integer
                minimum: 1
                maximum: 365
              items:
                type: array
                maxItems: 500
                items:
                  type: object
                  required:
                    - item_type
                  additionalProperties: true
                  properties:
                    item_type:
                      type: string
                      maxLength: 50
